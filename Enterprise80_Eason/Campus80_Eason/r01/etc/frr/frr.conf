frr defaults traditional
hostname r01
service integrated-vtysh-config
log syslog informational
interface eth0
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth1
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth2
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth3
 ip ospf network point-to-point
 no ip ospf passive
!
router ospf
 ospf router-id 10.255.0.1
 passive-interface default
 network 10.250.1.0/30 area 0
 network 10.250.2.0/30 area 0
 network 10.250.3.0/30 area 0
 network 10.250.4.0/30 area 0
 network 10.10.1.0/24 area 0
!
line vty
