global
    maxconn 256
defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s
frontend app
    bind 10.0.1.80:8080
    default_backend app_servers
backend app_servers
    balance roundrobin
    server web1 10.0.1.2:80 check inter 500ms fall 1 rise 1
    server web2 10.0.2.2:80 check inter 500ms fall 1 rise 1
    server web3 10.0.3.2:80 check inter 500ms fall 1 rise 1
listen management
    bind 10.0.1.80:9090
    stats enable
    stats uri /stats
    http-request deny unless { src 10.2.7.0/24 10.3.7.0/24 }
