hostname leaf_router_2_0
log file /var/log/frr/frr.log
router bgp 65220
 bgp router-id 172.16.1.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 timers bgp 5 15
 neighbor 172.16.1.0 remote-as 65120
 neighbor 172.16.1.0 timers connect 3
 neighbor 172.16.1.16 remote-as 65121
 neighbor 172.16.1.16 timers connect 3
 neighbor 172.16.1.32 remote-as 65122
 neighbor 172.16.1.32 timers connect 3
 neighbor 172.16.1.48 remote-as 65123
 neighbor 172.16.1.48 timers connect 3
 address-family ipv4 unicast
  maximum-paths 32
  network 10.2.0.0/24
 exit-address-family
!
