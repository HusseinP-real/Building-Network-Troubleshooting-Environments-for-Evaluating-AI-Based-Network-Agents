hostname leaf_router_0_0
log file /var/log/frr/frr.log
router bgp 65200
 bgp router-id 172.16.0.129
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 timers bgp 5 15
 neighbor 172.16.0.128 remote-as 65100
 neighbor 172.16.0.128 timers connect 3
 neighbor 172.16.0.144 remote-as 65101
 neighbor 172.16.0.144 timers connect 3
 neighbor 172.16.0.160 remote-as 65102
 neighbor 172.16.0.160 timers connect 3
 neighbor 172.16.0.176 remote-as 65103
 neighbor 172.16.0.176 timers connect 3
 address-family ipv4 unicast
  maximum-paths 32
  network 10.0.0.0/24
 exit-address-family
!
