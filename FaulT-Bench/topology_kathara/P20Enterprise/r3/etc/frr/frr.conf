hostname r3
password zebra
log file /var/log/frr/ospfd.log
!
interface eth0
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth2
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth3
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth4
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth5
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth6
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 10.255.255.3
 passive-interface default
 network 10.255.2.0/30 area 0.0.0.0
 no passive-interface eth0
 network 10.255.3.0/30 area 0.0.0.0
 no passive-interface eth1
 network 10.255.5.0/30 area 0.0.0.0
 no passive-interface eth2
 network 10.255.11.0/30 area 0.0.0.0
 no passive-interface eth3
 network 10.255.14.0/30 area 0.0.0.0
 no passive-interface eth4
 network 10.255.27.0/30 area 0.0.0.0
 no passive-interface eth5
 network 10.255.30.0/30 area 0.0.0.0
 no passive-interface eth6
!
line vty
!
