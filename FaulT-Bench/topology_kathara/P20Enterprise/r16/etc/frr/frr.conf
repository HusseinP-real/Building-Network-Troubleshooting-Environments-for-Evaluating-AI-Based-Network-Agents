hostname r16
password zebra
log file /var/log/frr/ospfd.log
!
interface eth0
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth1
 ip ospf cost 100
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth2
 ip ospf cost 1
!
interface eth3
 ip ospf cost 1
!
router ospf
 ospf router-id 10.255.255.16
 passive-interface default
 network 10.255.20.0/30 area 0.0.0.4
 no passive-interface eth0
 network 10.255.21.0/30 area 0.0.0.4
 no passive-interface eth1
 network 10.10.4.0/24 area 0.0.0.4
 network 10.40.4.0/24 area 0.0.0.4
!
line vty
!
