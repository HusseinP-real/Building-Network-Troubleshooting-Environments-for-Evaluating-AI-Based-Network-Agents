hostname r20
password zebra
log file /var/log/frr/ospfd.log
!
interface eth0
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 10.255.255.20
 passive-interface default
 network 10.255.26.0/30 area 0.0.0.0
 no passive-interface eth0
 network 10.255.28.0/30 area 0.0.0.6
 no passive-interface eth1
!
line vty
!
