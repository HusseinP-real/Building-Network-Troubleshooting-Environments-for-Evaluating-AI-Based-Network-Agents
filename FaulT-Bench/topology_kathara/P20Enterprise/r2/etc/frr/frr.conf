hostname r2
password zebra
log file /var/log/frr/ospfd.log
!
interface eth0
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth1
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth2
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth3
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 10.255.255.2
 passive-interface default
 network 10.255.1.0/30 area 0.0.0.0
 no passive-interface eth0
 network 10.255.2.0/30 area 0.0.0.0
 no passive-interface eth1
 network 10.255.7.0/30 area 0.0.0.0
 no passive-interface eth2
 network 10.255.10.0/30 area 0.0.0.0
 no passive-interface eth3
!
line vty
!
