LAB_NAME="Kath6 Static Route Fault Demo"
LAB_DESCRIPTION="Four-node routed topology for a FaulT-Bench static-route removal scenario"
LAB_VERSION="1.0"

# Left LAN: pc1 <-> r1
pc1[0]="lan_left"
r1[0]="lan_left"

# Transit: r1 <-> r2
r1[1]="transit"
r2[0]="transit"

# Right LAN: r2 <-> pc2
r2[1]="lan_right"
pc2[0]="lan_right"
