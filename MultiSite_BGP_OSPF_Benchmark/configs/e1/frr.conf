frr version 10.0
frr defaults traditional
hostname e1
service integrated-vtysh-config
!
ip route 10.0.0.0/8 Null0
!
router ospf
 ospf router-id 10.254.0.1
 redistribute connected
 redistribute bgp metric 40 metric-type 1
 network 10.255.1.0/31 area 0
 network 10.255.4.0/31 area 0
 network 10.255.5.0/31 area 0
 network 10.255.12.0/31 area 0
!
router bgp 65000
 bgp router-id 10.254.0.1
 no bgp ebgp-requires-policy
 neighbor 172.31.1.1 remote-as 65010
 network 10.0.0.0/8
!
line vty
!
