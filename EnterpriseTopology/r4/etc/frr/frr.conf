hostname r4
service integrated-vtysh-config
log file /var/log/frr/enterprise.log
interface lo
 ip ospf area 0
!
interface eth0
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth1
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth2
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface eth3.410
 ip ospf area 0
!
interface eth4.420
 ip ospf area 0
!
interface eth5.430
 ip ospf area 0
!
router ospf
 ospf router-id 10.255.255.4
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
 no passive-interface eth2
!
