hostname as65010r1
service integrated-vtysh-config
log stdout
!
interface lo
!
interface eth0
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth1
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth2
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth3
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth4
 ip router isis CORE
 isis circuit-type level-2-only
!
interface lo
 ip router isis CORE
!
router isis CORE
 net 49.0001.0010.0001.0000.00
 is-type level-2-only
 metric-style wide
!
router bgp 65010
 bgp router-id 10.10.255.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.10.255.2 remote-as 65010
 neighbor 10.10.255.2 update-source lo
 neighbor 10.10.255.3 remote-as 65010
 neighbor 10.10.255.3 update-source lo
 neighbor 10.10.255.4 remote-as 65010
 neighbor 10.10.255.4 update-source lo
 neighbor 10.10.255.5 remote-as 65010
 neighbor 10.10.255.5 update-source lo
 neighbor 10.10.255.6 remote-as 65010
 neighbor 10.10.255.6 update-source lo
 neighbor 172.20.0.2 remote-as 65020
 address-family ipv4 unicast
  network 10.10.0.0/16
  neighbor 10.10.255.2 next-hop-self
  neighbor 10.10.255.3 next-hop-self
  neighbor 10.10.255.4 next-hop-self
  neighbor 10.10.255.5 next-hop-self
  neighbor 10.10.255.6 next-hop-self
 exit-address-family
!
line vty
!
