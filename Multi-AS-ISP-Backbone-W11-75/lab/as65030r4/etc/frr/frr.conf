hostname as65030r4
service integrated-vtysh-config
log stdout
!
interface lo
!
interface eth0
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth1
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth2
 ip router isis CORE
 isis circuit-type level-2-only
!
interface eth3
 ip router isis CORE
 isis circuit-type level-2-only
!
interface lo
 ip router isis CORE
!
router isis CORE
 net 49.0001.0030.0004.0000.00
 is-type level-2-only
 metric-style wide
!
router bgp 65030
 bgp router-id 10.30.255.4
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.30.255.1 remote-as 65030
 neighbor 10.30.255.1 update-source lo
 neighbor 10.30.255.2 remote-as 65030
 neighbor 10.30.255.2 update-source lo
 neighbor 10.30.255.3 remote-as 65030
 neighbor 10.30.255.3 update-source lo
 neighbor 10.30.255.5 remote-as 65030
 neighbor 10.30.255.5 update-source lo
 neighbor 10.30.255.6 remote-as 65030
 neighbor 10.30.255.6 update-source lo
 neighbor 172.20.0.18 remote-as 65200
 address-family ipv4 unicast
  network 10.30.0.0/16
  neighbor 10.30.255.1 next-hop-self
  neighbor 10.30.255.2 next-hop-self
  neighbor 10.30.255.3 next-hop-self
  neighbor 10.30.255.5 next-hop-self
  neighbor 10.30.255.6 next-hop-self
 exit-address-family
!
line vty
!
