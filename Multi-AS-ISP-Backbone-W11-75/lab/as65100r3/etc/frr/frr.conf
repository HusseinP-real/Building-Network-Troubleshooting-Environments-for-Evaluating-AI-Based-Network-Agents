hostname as65100r3
service integrated-vtysh-config
log stdout
!
interface lo
!
interface eth0
 ip ospf area 0
 no ip ospf passive
!
interface eth1
 ip ospf area 0
 no ip ospf passive
!
interface eth2
 ip ospf area 0
 ip ospf passive
!
interface eth3
 ip ospf area 0
 ip ospf passive
!
interface lo
 ip ospf area 0
!
router ospf
 ospf router-id 10.40.255.3
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
!
router bgp 65100
 bgp router-id 10.40.255.3
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.40.255.1 remote-as 65100
 neighbor 10.40.255.1 update-source lo
 neighbor 10.40.255.2 remote-as 65100
 neighbor 10.40.255.2 update-source lo
 neighbor 10.40.255.4 remote-as 65100
 neighbor 10.40.255.4 update-source lo
 neighbor 10.40.255.5 remote-as 65100
 neighbor 10.40.255.5 update-source lo
 neighbor 10.40.255.6 remote-as 65100
 neighbor 10.40.255.6 update-source lo
 neighbor 172.20.0.21 remote-as 65010
 address-family ipv4 unicast
  network 10.40.0.0/16
  neighbor 10.40.255.1 next-hop-self
  neighbor 10.40.255.2 next-hop-self
  neighbor 10.40.255.4 next-hop-self
  neighbor 10.40.255.5 next-hop-self
  neighbor 10.40.255.6 next-hop-self
 exit-address-family
!
line vty
!
