frr defaults traditional
hostname spine1
log file /var/log/frr/fabric.log
service integrated-vtysh-config
!
ip prefix-list FABRIC seq 10 permit 10.60.1.0/24
ip prefix-list FABRIC seq 20 permit 10.60.2.0/24
ip prefix-list FABRIC seq 30 permit 10.60.3.0/24
ip prefix-list FABRIC seq 40 permit 10.60.4.0/24
ip prefix-list FABRIC seq 50 permit 10.60.5.0/24
ip prefix-list FABRIC seq 60 permit 10.60.6.0/24
ip prefix-list FABRIC seq 70 permit 10.254.0.1/32
ip prefix-list FABRIC seq 80 permit 10.254.0.2/32
ip prefix-list FABRIC seq 90 permit 10.254.0.3/32
ip prefix-list FABRIC seq 100 permit 10.254.1.1/32
ip prefix-list FABRIC seq 110 permit 10.254.1.2/32
ip prefix-list FABRIC seq 120 permit 10.254.1.3/32
ip prefix-list FABRIC seq 130 permit 10.254.1.4/32
ip prefix-list FABRIC seq 140 permit 10.254.1.5/32
ip prefix-list FABRIC seq 150 permit 10.254.1.6/32
ip prefix-list LOCAL seq 10 permit 10.254.0.1/32
ip prefix-list LEAF1 seq 10 permit 10.60.1.0/24
ip prefix-list LEAF1 seq 20 permit 10.254.1.1/32
ip prefix-list LEAF2 seq 10 permit 10.60.2.0/24
ip prefix-list LEAF2 seq 20 permit 10.254.1.2/32
ip prefix-list LEAF3 seq 10 permit 10.60.3.0/24
ip prefix-list LEAF3 seq 20 permit 10.254.1.3/32
ip prefix-list LEAF4 seq 10 permit 10.60.4.0/24
ip prefix-list LEAF4 seq 20 permit 10.254.1.4/32
ip prefix-list LEAF5 seq 10 permit 10.60.5.0/24
ip prefix-list LEAF5 seq 20 permit 10.254.1.5/32
ip prefix-list LEAF6 seq 10 permit 10.60.6.0/24
ip prefix-list LEAF6 seq 20 permit 10.254.1.6/32
router bgp 65000
 bgp router-id 10.254.0.1
 bgp ebgp-requires-policy
 bgp network import-check
 no bgp default ipv4-unicast
 timers bgp 3 9
 neighbor 172.22.0.0 remote-as 65101
 neighbor 172.22.0.0 description leaf1
 neighbor 172.22.0.6 remote-as 65102
 neighbor 172.22.0.6 description leaf2
 neighbor 172.22.0.12 remote-as 65103
 neighbor 172.22.0.12 description leaf3
 neighbor 172.22.0.18 remote-as 65104
 neighbor 172.22.0.18 description leaf4
 neighbor 172.22.0.24 remote-as 65105
 neighbor 172.22.0.24 description leaf5
 neighbor 172.22.0.30 remote-as 65106
 neighbor 172.22.0.30 description leaf6
 address-family ipv4 unicast
  maximum-paths 3
  network 10.254.0.1/32
  neighbor 172.22.0.0 activate
  neighbor 172.22.0.0 prefix-list LEAF1 in
  neighbor 172.22.0.0 prefix-list FABRIC out
  neighbor 172.22.0.6 activate
  neighbor 172.22.0.6 prefix-list LEAF2 in
  neighbor 172.22.0.6 prefix-list FABRIC out
  neighbor 172.22.0.12 activate
  neighbor 172.22.0.12 prefix-list LEAF3 in
  neighbor 172.22.0.12 prefix-list FABRIC out
  neighbor 172.22.0.18 activate
  neighbor 172.22.0.18 prefix-list LEAF4 in
  neighbor 172.22.0.18 prefix-list FABRIC out
  neighbor 172.22.0.24 activate
  neighbor 172.22.0.24 prefix-list LEAF5 in
  neighbor 172.22.0.24 prefix-list FABRIC out
  neighbor 172.22.0.30 activate
  neighbor 172.22.0.30 prefix-list LEAF6 in
  neighbor 172.22.0.30 prefix-list FABRIC out
 exit-address-family
!
line vty
!
