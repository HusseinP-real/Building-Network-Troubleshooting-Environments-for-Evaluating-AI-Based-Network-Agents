frr defaults traditional
hostname r10
service integrated-vtysh-config
log syslog informational
interface eth0
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth1
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth2
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth3
 ip ospf network point-to-point
 no ip ospf passive
!
router ospf
 ospf router-id 10.255.0.10
 passive-interface default
 network 10.250.10.0/30 area 0
 network 10.250.15.0/30 area 0
 network 10.250.18.0/30 area 0
 network 10.250.19.0/30 area 0
 network 10.10.10.0/24 area 0
!
line vty
