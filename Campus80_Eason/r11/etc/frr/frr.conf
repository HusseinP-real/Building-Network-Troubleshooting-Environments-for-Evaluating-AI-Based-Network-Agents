frr defaults traditional
hostname r11
service integrated-vtysh-config
log syslog informational
interface eth0
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth1
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth2
 ip ospf network point-to-point
 no ip ospf passive
!
router ospf
 ospf router-id 10.255.0.11
 passive-interface default
 network 10.250.12.0/30 area 0
 network 10.250.19.0/30 area 0
 network 10.250.20.0/30 area 0
 network 10.10.11.0/24 area 0
!
line vty
