frr defaults traditional
hostname r08
service integrated-vtysh-config
log syslog informational
interface eth0
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth1
 ip ospf network point-to-point
 no ip ospf passive
!
interface eth2
 ip ospf network point-to-point
 no ip ospf passive
!
router ospf
 ospf router-id 10.255.0.8
 passive-interface default
 network 10.250.6.0/30 area 0
 network 10.250.14.0/30 area 0
 network 10.250.17.0/30 area 0
 network 10.10.8.0/24 area 0
!
line vty
